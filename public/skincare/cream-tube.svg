<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 400" fill="none" aria-hidden="true">
  <!-- ALFURIN cream tube  transparent bg -->
  <defs>
    <linearGradient id="tubeBody" x1="20" y1="40" x2="140" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFEF9"/>
      <stop offset="0.55" stop-color="#EBE4D6"/>
      <stop offset="1" stop-color="#D4CBB8"/>
    </linearGradient>
  </defs>
  <!-- cap -->
  <rect x="48" y="12" width="64" height="42" rx="10" fill="#2C2A26"/>
  <rect x="56" y="48" width="48" height="16" rx="4" fill="#3A3834"/>
  <!-- shoulder -->
  <path d="M44 64 H116 L128 92 H32 Z" fill="#C9C2B2" stroke="#B7AFA0" stroke-width="1"/>
  <!-- body -->
  <path d="M32 92 H128 V330 C128 350 112 366 92 366 H68 C48 366 32 350 32 330 Z" fill="url(#tubeBody)" stroke="#B7AFA0" stroke-width="1.5"/>
  <path d="M52 110 V300" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="10" stroke-linecap="round"/>
  <!-- crimp -->
  <path d="M36 366 H124" stroke="#A89F8E" stroke-width="6" stroke-linecap="round"/>
  <path d="M40 374 H120" stroke="#C9C2B2" stroke-width="3" stroke-linecap="round"/>
  <!-- label -->
  <rect x="48" y="150" width="64" height="100" rx="6" fill="#F7F7F2" stroke="#C8C0B0" stroke-width="1"/>
  <text x="80" y="186" text-anchor="middle" fill="#2C2A26" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">ALFURIN</text>
  <text x="80" y="204" text-anchor="middle" fill="#8A9A7B" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="7" letter-spacing="1">CREAM</text>
  <line x1="58" y1="218" x2="102" y2="218" stroke="#DDD8CE"/>
  <text x="80" y="236" text-anchor="middle" fill="#7A756C" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="6">NPF</text>
</svg>

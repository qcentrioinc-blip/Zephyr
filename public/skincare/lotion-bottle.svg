<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 420" fill="none" aria-hidden="true">
  <!-- ALFURIN lotion bottle  transparent bg -->
  <defs>
    <linearGradient id="lotBody" x1="40" y1="80" x2="200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F1E8"/>
      <stop offset="0.45" stop-color="#E8E2D4"/>
      <stop offset="1" stop-color="#D9D1C0"/>
    </linearGradient>
    <linearGradient id="lotShine" x1="70" y1="100" x2="110" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- pump -->
  <rect x="102" y="18" width="36" height="28" rx="6" fill="#2C2A26"/>
  <rect x="94" y="40" width="52" height="14" rx="4" fill="#3A3834"/>
  <path d="M118 18 V8" stroke="#2C2A26" stroke-width="4" stroke-linecap="round"/>
  <path d="M118 8 H132" stroke="#2C2A26" stroke-width="4" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="88" y="52" width="64" height="36" rx="8" fill="#C9C2B2"/>
  <!-- body -->
  <path d="M56 100 C56 88 68 80 84 80 H156 C172 80 184 88 184 100 V360 C184 384 164 400 140 400 H100 C76 400 56 384 56 360 Z" fill="url(#lotBody)" stroke="#B7AFA0" stroke-width="1.5"/>
  <path d="M78 110 C78 110 86 300 86 340" stroke="url(#lotShine)" stroke-width="14" stroke-linecap="round"/>
  <!-- label -->
  <rect x="78" y="180" width="84" height="110" rx="8" fill="#F7F7F2" stroke="#C8C0B0" stroke-width="1"/>
  <text x="120" y="218" text-anchor="middle" fill="#2C2A26" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">ALFURIN</text>
  <text x="120" y="238" text-anchor="middle" fill="#8A9A7B" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1">LOTION</text>
  <line x1="96" y1="252" x2="144" y2="252" stroke="#DDD8CE" stroke-width="1"/>
  <text x="120" y="272" text-anchor="middle" fill="#7A756C" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="7">Defence</text>
</svg>

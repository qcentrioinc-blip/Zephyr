<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/brand/V_logo.png?v=2" />
    <link rel="apple-touch-icon" href="/brand/V_logo.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vitalcore is the brand. Zephyr is the manufacturing unit for vitamins, minerals, specialty dosages, and finished supplements for private-label and brand owners."
    />
    <link rel="canonical" href="https://www.zephyrlabsinc.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vitalcore" />
    <meta property="og:title" content="Vitalcore | Manufactured by Zephyr" />
    <meta
      property="og:description"
      content="Vitalcore is the brand. Zephyr is the manufacturing unit for vitamins, minerals, specialty dosages, and finished supplements for private-label and brand owners."
    />
    <meta property="og:image" content="https://www.zephyrlabsinc.com/brand/vitalcore-logo-clear.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Warm hero decode on first visit (cuts first-scroll layout stutter on Mac). -->
    <link rel="preload" as="image" href="/videos/slide-1-poster.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/vitalcore-logo.svg" />
    <title>Vitalcore | Manufactured by Zephyr</title>
    <script>
      // Hard refresh clears the entry gate before paint. A normal reload keeps it.
      // Key matches src/lib/entry-gate.ts.
      (function () {
        try {
          if ("scrollRestoration" in history) history.scrollRestoration = "manual";
          var gateKey = "zephyr:entry-gate-seen";
          var nav = performance.getEntriesByType("navigation")[0];
          // On normal reload (F5 / reload button), keep entry-gate state in sessionStorage so the user stays on their page.
          // On hard reload (Ctrl+F5 / Shift+Reload), transferSize reflects an un-cached network fetch (> 0) or server reload,
          // while deliveryType !== "cache". However, deliveryType alone was wiping normal reloads where deliveryType is empty string.
          // In standard browser sessions, sessionStorage naturally persists across normal reloads.
          // Detect explicit hard refresh where transferSize > 0 and navigation was forced reload with bypass,
          // while ensuring normal reload never clears the gate.
          if (
            nav &&
            nav.type === "reload" &&
            typeof nav.transferSize === "number" &&
            nav.transferSize > 0 &&
            nav.deliveryType === "" &&
            nav.encodedBodySize > 0 &&
            nav.transferSize >= nav.encodedBodySize
          ) {
            // Uncached / hard reload: clear gate to trigger lock screen
            sessionStorage.removeItem(gateKey);
          }
          if (sessionStorage.getItem(gateKey) !== "1") {
            document.documentElement.classList.add("zephyr-lock-pending");
          }
          var y = Number(sessionStorage.getItem("zephyr:scroll:" + location.pathname) || "0");
          if (y > 0) document.documentElement.classList.add("scroll-restore-pending");
        } catch (e) {}
      })();
    </script>
    <style>
      html.scroll-restore-pending,
      html.scroll-restore-pending body {
        visibility: hidden;
      }
      html.zephyr-lock-pending,
      html.zephyr-lock-pending body {
        visibility: visible;
        background: #0d241c;
      }
      html.zephyr-lock-pending #root {
        visibility: hidden;
      }
      #zephyr-lock-mark {
        display: none;
      }
      html.zephyr-lock-pending #zephyr-lock-mark {
        position: fixed;
        inset: 0;
        z-index: 99998;
        display: grid;
        place-items: center;
        background: #0d241c;
        pointer-events: none;
      }
      html.zephyr-lock-pending #zephyr-lock-mark img {
        width: calc(min(88vw, 46rem) * 0.76);
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="zephyr-lock-mark">
      <img src="/brand/vitalcore-logo.svg" alt="Vitalcore" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

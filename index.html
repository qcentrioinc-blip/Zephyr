<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Zephyr manufactures nutraceutical, herbaceutical, and organic dietary supplements for US brand owners. 65,000 sq ft facility, GMP/ISO systems, and MOQ-ready private-label programs."
    />
    <link rel="canonical" href="https://zephyr.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zephyr" />
    <meta property="og:title" content="Zephyr — CDMO & Private-Label Manufacturing Partner" />
    <meta
      property="og:description"
      content="Zephyr manufactures nutraceutical, herbaceutical, and organic dietary supplements for US brand owners. 65,000 sq ft facility, GMP/ISO systems, and MOQ-ready private-label programs."
    />
    <meta property="og:image" content="https://zephyr.vercel.app/brand/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Warm hero decode on first visit (cuts first-scroll layout stutter on Mac). -->
    <link rel="preload" as="image" href="/homepage/herbal.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/logo.png" />
    <title>Zephyr — CDMO & Private-Label Manufacturing Partner</title>
    <script>
      // Instant scroll restore: hide first paint if we have a saved offset for this path.
      (function () {
        try {
          if ("scrollRestoration" in history) history.scrollRestoration = "manual";
          var y = Number(sessionStorage.getItem("zephyr:scroll:" + location.pathname) || "0");
          if (y > 0) document.documentElement.classList.add("scroll-restore-pending");
        } catch (e) {}
      })();
    </script>
    <style>
      html.scroll-restore-pending,
      html.scroll-restore-pending body {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
